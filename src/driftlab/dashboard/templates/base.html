<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}DriftLab{% endblock %}</title>
<style>
  /* glass-graph palette, no CDN — must render air-gapped */
  :root {
    --ok-bg:#d9f7be; --ok-fg:#389e0d;
    --warn-bg:#fff7cc; --warn-fg:#d48806;
    --med-bg:#ffe7cc; --med-fg:#fa8c16;
    --crit-bg:#fff1f0; --crit-fg:#cf1322;
    --waived-bg:#f9e6ff; --waived-fg:#722ed1;
    --focus-bg:#e6f4ff; --focus-fg:#1677ff;
    --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --paper:#fafafa;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
         color:var(--ink); background:var(--paper); font-size:14px; }
  header { background:#111827; color:#f9fafb; padding:10px 24px; display:flex; gap:24px; align-items:baseline; }
  header a { color:#f9fafb; text-decoration:none; opacity:.85 } header a:hover { opacity:1 }
  header .brand { font-weight:700; font-size:16px; letter-spacing:.5px }
  main { max-width:1100px; margin:24px auto; padding:0 24px; }
  h1 { font-size:20px; } h2 { font-size:16px; margin-top:28px; }
  table { border-collapse:collapse; width:100%; background:#fff; border:1px solid var(--line); }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:#f3f4f6; font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); }
  tr:last-child td { border-bottom:none }
  a { color:var(--focus-fg); }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; }
  .badge.critical, .badge.high { background:var(--crit-bg); color:var(--crit-fg); }
  .badge.medium { background:var(--med-bg); color:var(--med-fg); }
  .badge.low, .badge.warning { background:var(--warn-bg); color:var(--warn-fg); }
  .badge.info { background:#f0f0f0; color:#6b7280; }
  .badge.ok, .badge.confirmed { background:var(--ok-bg); color:var(--ok-fg); }
  .badge.waived { background:var(--waived-bg); color:var(--waived-fg); }
  .badge.refuted { background:var(--focus-bg); color:var(--focus-fg); }
  .badge.inconclusive { background:#f0f0f0; color:#6b7280; }
  .score { font-weight:700; font-size:18px; }
  .score.ok { color:var(--ok-fg);} .score.warning{ color:var(--warn-fg);}
  .score.medium{ color:var(--med-fg);} .score.critical{ color:var(--crit-fg);}
  .muted { color:var(--muted); font-size:12px; }
  code { background:#f3f4f6; padding:1px 5px; border-radius:4px; font-size:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 20px; margin:12px 0; }
</style>
</head>
<body>
<header>
  <span class="brand">DriftLab</span>
  <a href="/">Estate</a>
  <a href="/anomalies">Anomalies</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
