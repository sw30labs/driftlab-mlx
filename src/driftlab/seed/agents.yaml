# DriftLab monitored-agent registry (regitel jurisdictions.yaml pattern).
# priority 1..7 drives the staleness-weighted monitor: 1 = check daily.
# Paths are relative to this file.

agents:
  - id: loan-officer
    name: Loan Officer (credit decisioning)
    priority: 1
    baseline: baselines/loan-officer-profile.json
    traces: traces/loan-officer-drifted.jsonl
    description: >
      Credit-decisioning agent for consumer loans. High-value / high-risk
      decisions require human review before funds movement.

  - id: support-triage
    name: Support Triage
    priority: 3
    baseline: baselines/support-triage-profile.json
    traces: traces/support-triage-clean.jsonl
    description: >
      Customer-support triage agent. Angry customers must reach a human;
      automated FAQ replies are budget-capped.
