[project]
name = "driftlab"
version = "2.1.0"
description = "Continuous, machine-readable compliance observer for running agentic systems — behavioral drift detection against certified OSCAL baselines, with experimental drift proof."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Cravino", email = "ncravino@mac.com" }]
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "networkx>=3.2,<4.0",
    "typer>=0.12,<1.0",
    "rich>=13.0",
    "pyyaml>=6.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "langgraph>=0.4,<2.0",
]

# The web command deck and the advisory OMLX client are stdlib-only by design:
# no server framework, no template engine, no HTTP client, no LLM SDK.

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
driftlab = "driftlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.uv]
# This project is installed as a wheel via `uv pip install .` (the editable
# install's .pth is not honored by this uv/venv combination). Setting
# package=false stops `uv run` from re-installing the broken editable build,
# so the wheel-installed console script remains importable.
package = false