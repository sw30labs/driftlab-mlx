[project]
name = "driftlab"
version = "0.1.0"
description = "Continuous, machine-readable compliance observer for running agentic systems — behavioral drift detection against certified OSCAL baselines, with experimental drift proof."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Nicolas Cravino", email = "ncravino@mac.com" }]
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "networkx>=3.2,<4.0",
    "typer>=0.12,<1.0",
    "rich>=13.0",
    "pyyaml>=6.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "fastapi>=0.110,<1.0",
    "jinja2>=3.1,<4.0",
    "uvicorn>=0.29,<1.0",
    "langgraph>=0.4,<2.0",
]

[project.optional-dependencies]
llm = [
    "langchain-openai>=0.3,<2.0",
    "deepagents>=0.6,<1.0",
]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
driftlab = "driftlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
